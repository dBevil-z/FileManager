[package]
name = "filemanager"
version = "0.2.5"
edition = "2024"
repository = "https://github.com/dBevil-z/FileManager"
description = "A thoughtful file manager for Linux"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
filemanager-core = { path = "../crates/filemanager-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
libc = "0.2"
url = "2"
zbus = "5.19"
webkit2gtk = "2"
cairo-rs = { version = "0.18", features = ["png"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
[lib]
name = "filemanager_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tiny_http = "0.12"
