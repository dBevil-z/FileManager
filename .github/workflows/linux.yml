name: Linux checks and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  linux:
    name: Ubuntu 24.04 · x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libx11-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: pnpm build
      - run: cargo fmt --all --check
      - name: Test core and native integration in an isolated display
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --locked
        env:
          GTK_USE_PORTAL: "0"
          NO_AT_BRIDGE: "1"
